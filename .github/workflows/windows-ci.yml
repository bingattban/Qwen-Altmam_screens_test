name: Windows Core Build
# Phase 01 canonical filename: windows-ci.yml; this is the SAME Core workflow, not a third one.
on:
  # Validate proposed code on its PR BEFORE promotion to main.
  # Main is validated again after a successful PR merge.
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
# Only the newest revision of a branch needs a build. Avoid CI overload when
# successive implementation commits land; the final commit still builds fully.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  manifest-contract:
    name: Manifest contract guard (69 routes / 103 actions)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Action/screen manifest security + drift guard
        run: python build/manifest-guard.py
      - name: Phase 00–02 live inventory, Windows CI and SQLCipher drift guard
        run: |
          python build/test-phase00-02-gates.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 00–02 negative-path regression failed' }
          python build/verify-phase00-02-gates.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 00–02 live contract drift detected' }
      - name: Phase 00–01 exact screen matrix and solution inventory regression
        run: python build/test-phase00-01-inventory.py
      - name: Phase 13 PowerShell self-check scripts pass native parser before expensive tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./build/check-powershell-test-syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Invalid PowerShell QA script syntax' }
      - name: Verify pinned Cairo/Tajawal HTTP 503 retry, alternate source and checksum (offline mock)
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./build/test-verified-build-font-fetch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Arabic offline font retry and pinned checksum regression failed' }
      - name: Verify offline WebView2 ResponseEnded retry and signature rejection (offline mock)
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./build/test-offline-webview2-fetch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Offline WebView2 download regression failed' }
      - name: Package process watchdog native regression before expensive tests
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File ./build/test-package-process-watchdog.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Package process watchdog regression failed' }
      - name: Phase 13 evidence contract guard before lengthy Windows tests
        shell: pwsh
        run: |
          python build/test-phase13-qa-evidence-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 13 evidence source or order regression' }
      - name: Phase 14 distribution staging provenance regression
        shell: pwsh
        run: |
          python build/test-phase14-distribution-stage.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 14 distribution stage negative-path regression' }
      - name: Phase 15 non-destructive static handover/route/RBAC regression
        shell: pwsh
        run: |
          python build/test-phase15-handover-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 15 static contract regression failed' }
      - name: Section 08 canonical UI-to-native bridge and response envelope contract
        shell: pwsh
        run: |
          python build/test-section08-bridge-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 08 UI/native contract regression' }
      - name: Phase 15 all-four SHA256 provenance negative-path tests
        shell: pwsh
        run: |
          python build/test-phase15-handover.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 15 four-artifact metadata / SHA256 regression' }
          python build/test-section11-delivery-standard.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 15 cross-architecture file checksum or source regression' }
      - name: Section 11 independent disconnected-Windows probe input integrity regression (synthetic only)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./build/test-independent-offline-windows-contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Section 11 physical offline probe contract failed; NOT UAT' }
      - name: Validate Arabic navigation and JavaScript syntax
        shell: pwsh
        run: |
          python build/validate-ui-shell.py
          if ($LASTEXITCODE -ne 0) { throw 'UI shell contract failed' }
          python build/test-ci-exit-guards.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 CI exit-code guard failed' }
          python build/test-ci-build-modes.py
          if ($LASTEXITCODE -ne 0) { throw 'Development/full release mode contract failed' }
          python build/test-ci-performance-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 CI optimization safety guard failed' }
          python build/test-ci-fast-gates.py
          if ($LASTEXITCODE -ne 0) { throw 'Fast Core / exhaustive Release gate regression' }
          python build/test-ci-sharding-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Release shards / packaging gate mismatch' }
          python build/test-parallel-package-acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Four real package acceptance gates must remain mandatory' }
          python build/test-parallel-release-webview-gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Parallel real Windows WebView2 acceptance cannot be bypassed' }
          python build/test-recovery-session-readiness-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Real recovery session and failure evidence guard regressed' }
          python build/test-release-test-shards.py
