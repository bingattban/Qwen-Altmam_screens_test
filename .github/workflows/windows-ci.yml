          python build/test-native-phase8-excel-personnel-import-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 additive-only XLSX import contract failed' }
          python build/test-native-phase8-safe-multisheet-import-contract.py
