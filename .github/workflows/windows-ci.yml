          python build/test-native-auto-register-phase3-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF auto-prepared register and timer security contract failed' }
          python build/test-native-phase4-scheduler-approval-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Phase4 durable scheduler and explicit reviewed attendance commit contract failed' }
          python build/test-native-phase5-bounded-ranges-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 5 bounded leave/permission contract failed' }
          python build/test-native-phase6-daily-roster-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 6 daily SQLCipher roster / session gate failed' }
          python build/test-native-phase7-monthly-roster-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 7 archived monthly SQLCipher / session contract failed' }
          python build/test-native-phase8-personnel-directory-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 personnel directory security contract failed' }
          python build/test-native-phase8-personnel-write-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 personnel mutation security contract failed' }
          python build/test-native-phase8-personnel-movement-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 personnel movement security contract failed' }
          python build/test-native-phase8-movement-archive-contract.py
