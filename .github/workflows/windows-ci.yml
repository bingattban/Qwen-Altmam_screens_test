          python build/test-native-phase8-import-outcome-history-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 owner-scoped Excel import outcome history failed' }
          python build/test-native-phase8-import-issues-export-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 8 XLSX issue export security contract failed' }
          python build/test-native-phase9-individual-person-report-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 individual historic report PersonId contract failed' }
          python build/test-native-phase9-site-revision-report-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 site and correction history contract failed' }
          python build/test-native-phase9-monthly-audit-report-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 monthly and audit historical report contract failed' }
          python build/test-native-phase9-individual-date-filter-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 individual inclusive date filter contract failed' }
          python build/test-native-phase9-movement-type-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 movement type filter contract failed' }
          python build/test-native-phase9-site-status-filter-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 canonical site and status filters failed' }
          python build/test-native-phase9-group-report-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 canonical group report contract failed' }
          python build/test-native-phase9-group-excel-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF Phase 9 canonical group Excel export contract failed' }
          python build/test-release-artifact-provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 release SHA-256 provenance regression failed' }
          python build/test-webview-selfcheck-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows real WebView2 smoke-test contract failed' }
          python build/test-local-reminders-contract.py
