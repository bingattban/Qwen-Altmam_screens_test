name: Import original AlTamam snapshot into migration branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-original.yml
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'bingattban/Qwen-Altmam_screens_test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/altamam-original"
          git -C "$RUNNER_TEMP/altamam-original" init
          git -C "$RUNNER_TEMP/altamam-original" remote add origin https://github.com/bingattban/Qwen-Altmam.git
          git -C "$RUNNER_TEMP/altamam-original" fetch --depth=1 origin fccaf469c78fc97a8f572b49c3738b84aa0719f3
          git -C "$RUNNER_TEMP/altamam-original" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/altamam-original" rev-parse HEAD)" = fccaf469c78fc97a8f572b49c3738b84aa0719f3
          cd "$RUNNER_TEMP/altamam-original"
          test "$(git hash-object README.md)" = 8d330dfbc76815928f27203f56d62809c550d894
          test "$(git hash-object src/AlTamam.DesktopHost/MainWindow.xaml.cs)" = fb5ed6b423134a397cd84bdfaf6013f3138893b6
          test "$(git hash-object src/AlTamam.WebUI/screen-manifest.json)" = 56cf23ca95900d36a16d3cac2ee3d77373a23891
          test "$(git hash-object .github/workflows/windows-ci.yml)" = 0127dc274ed2e39f8b3499434ba8284bcfe6f814
          test "$(git hash-object src/AlTamam.Application/Bridge/WebView2BridgeDispatcher.cs)" = bf40c149958934568c5fe966143ffe34071ca4de
      - name: Import to isolated migration branch without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b import/original-baseline
          SRC="$RUNNER_TEMP/altamam-original"
          git -C "$SRC" ls-files -z | while IFS= read -r -d '' file; do
            mkdir -p "$(dirname "$file")"
            cp "$SRC/$file" "$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import unchanged AlTamam project from pinned original commit'
          git push origin HEAD:refs/heads/import/original-baseline
